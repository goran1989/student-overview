<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fake IP Viewer</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 1.2rem;
    }
    button {
      padding: 14px 28px;
      background: #2563eb;
      border: none;
      color: white;
      font-size: 1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s ease-in-out;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    button:hover {
      background: #1e40af;
    }
    #ipDisplay {
      margin-top: 24px;
      font-size: 1.5rem;
      color: #22c55e;
      word-break: break-word;
    }

    .loading-dots {
      font-size: 1.25rem;
      color: #facc15;
      margin-top: 1rem;
    }

    .loading-dots span {
      animation: blink 1s infinite;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.4rem; }
      button { padding: 12px 24px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <h1>🔍 Reveal Your IP Address</h1>
  <button onclick="showFakeIP()">Reveal IP</button>
  <div id="loading" class="loading-dots" style="display:none;">
    Locating IP<span>.</span><span>.</span><span>.</span>
  </div>
  <div id="ipDisplay"></div>

  <audio id="popSound" preload="auto">
    <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_a44c2d66b3.mp3" type="audio/mpeg">
  </audio>

  <script>
    function showFakeIP() {
      const loading = document.getElementById("loading");
      const ipDisplay = document.getElementById("ipDisplay");
      const popSound = document.getElementById("popSound");

      ipDisplay.textContent = "";
      loading.style.display = "block";
      popSound.play();

      setTimeout(() => {
        const fakeIP = '192.168.' + Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255);
        loading.style.display = "none";
        ipDisplay.textContent = `IP: ${fakeIP}`;
      }, 2000);
    }
  </script>

</body>
</html>
