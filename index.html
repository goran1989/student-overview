<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Diva Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: linear-gradient(to right, #111, #1a1a1a);
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #ffd700;
      margin-top: 40px;
    }

    p {
      font-size: 1.2rem;
      color: #d4d4d4;
    }

    .button {
      margin-top: 20px;
      background: transparent;
      color: #ffd700;
      border: 2px solid #ffd700;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .button:hover {
      background: #ffd700;
      color: black;
    }

    .msg {
      margin-top: 30px;
      font-size: 1.4rem;
      color: #90ee90;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .msg.show {
      opacity: 1;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .gallery img {
      max-width: 160px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(255, 215, 0, 0.3);
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .gallery img { max-width: 120px; }
    }
  </style>
</head>
<body>

  <h1>✨ Digital Diva Detector ✨</h1>
  <p>Explore your luxury digital energy and unleash your inner queen 💼💻</p>
  <button class="button" onclick="showMessage()">Click Here to proceed</button>
  <div class="msg" id="funMessage">💄 Your IP: 192.168.98.👜.✨</div>

 

  <script>
    function showMessage() {
      const randomOctet = Math.floor(Math.random() * 255);
      document.getElementById('funMessage').textContent = `💄 Your IP: 192.168.${randomOctet}.${Math.floor(Math.random() * 255)} 💼`;
      document.getElementById('funMessage').classList.add('show');
    }
  </script>

</body>
</html>
