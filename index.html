<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Diva Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: linear-gradient(to right, #0f0f0f, #1a1a1a);
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 30px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      color: #ffd700;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #d4d4d4;
    }
    .button {
      background: transparent;
      color: #ffd700;
      border: 2px solid #ffd700;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
    }
    .button:hover {
      background: #ffd700;
      color: black;
    }
    .msg {
      margin-top: 30px;
      font-size: 1.5rem;
      color: #90ee90;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .msg.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <h1>✨ Digital Diva Detector ✨</h1>
  <p>Welcome to your fabulous cyber fashion forecast.</p>
  <button class="button" onclick="showMessage()">Reveal Style ID</button>
  <div class="msg" id="funMessage">💅 You’ve got elite digital taste. Fashion meets firewall!</div>

  <script>
    function showMessage() {
      document.getElementById('funMessage').classList.add('show');
    }
  </script>

</body>
</html>
